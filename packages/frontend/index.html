<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- Idioma pt-BR + trava de tradução automática: o navegador NÃO deve
         traduzir a página. Evita que o Google Tradutor/extensões reescrevam
         textos críticos (ex.: "Quero me candidatar" virando outra coisa). -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- NUNCA CACHEAR - SEMPRE VERSÃO MAIS RECENTE -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>%VITE_CLIENT_NAME%</title>
    <meta property="og:title" content="%VITE_CLIENT_NAME%" />
    <meta property="og:description" content="Kontrata.ai — Sistema de gestão de RH para supermercados" />
    <meta name="description" content="%VITE_CLIENT_NAME%" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body></html>
