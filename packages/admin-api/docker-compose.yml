# Painel interno do Kontrata — banco + API.
# Fica em /root/kontrata-admin na VPS 46.
#
# Portas escolhidas fora das faixas usadas pelos clientes (6xxx-9xxx) pra não
# colidir com nenhum container kontrata-<cliente>.
services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: kontrata-admin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - admin_pgdata:/var/lib/postgresql/data
    ports:
      - '5442:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: /root/kontrata-repo/packages/admin-api
      dockerfile: /root/kontrata-repo/packages/admin-api/Dockerfile
    image: kontrata-admin-api:latest
    container_name: kontrata-admin-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3020
      DB_HOST: kontrata-admin-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - '3020:3020'

volumes:
  admin_pgdata:
